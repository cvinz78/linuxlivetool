<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d7ff"/>
      <stop offset="1" stop-color="#5fff87"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- dezente Scanlinien -->
  <g stroke="#123" stroke-width="1" opacity="0.25">
    <line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
  </g>

  <!-- Titelblock links -->
  <text x="70" y="200" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#5fff87">~/Projekt $</text>
  <text x="290" y="200" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#e6e6e6">./live-toolbox.sh</text>
  <text x="70" y="285" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="72" fill="#00d7ff">LinuxLiveTool</text>
  <text x="70" y="330" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="30" fill="#ff87d7">(LLT)</text>
  <rect x="70" y="360" width="420" height="4" fill="url(#accent)"/>
  <text x="70" y="410" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#ffd75f">Live-ISO · Installation · Partitionierer</text>
  <text x="70" y="450" font-family="DejaVu Sans Mono, monospace" font-size="26" fill="#87ff5f">4 Distributionen — 1 Skript</text>
  <text x="70" y="560" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#ff87d7">GPL-3.0-or-later</text>
  <text x="330" y="560" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#8a99b5">reine Shell-Scripte · kein Setup nötig</text>

  <!-- Terminal-Fenster rechts (Menü-Mockup) -->
  <rect x="700" y="110" width="510" height="420" rx="12" fill="#0d1117" stroke="#2b3b55" stroke-width="2"/>
  <rect x="700" y="110" width="510" height="44" rx="12" fill="#161f2e"/>
  <circle cx="730" cy="132" r="8" fill="#ff5f56"/>
  <circle cx="756" cy="132" r="8" fill="#ffbd2e"/>
  <circle cx="782" cy="132" r="8" fill="#27c93f"/>
  <text x="860" y="139" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#8a99b5">live-toolbox v2.5</text>
  <text x="730" y="200" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#00d7ff">=== Hauptmenü ===</text>
  <text x="730" y="245" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#ffd75f">  1) Alpine</text>
  <text x="730" y="285" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#ffd75f">  2) Arch</text>
  <text x="730" y="325" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#ffd75f">  3) Debian</text>
  <text x="730" y="365" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#ffd75f">  4) Ubuntu</text>
  <text x="730" y="405" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#ff5f56">  0)  Beenden</text>
  <text x="730" y="445" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#ff5f56">  00) Beenden</text>
  <text x="730" y="505" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#e6e6e6">&gt; Auswahl: <tspan fill="#5fff87">█</tspan></text>
</svg>
