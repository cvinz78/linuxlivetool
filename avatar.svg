<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d7ff"/>
      <stop offset="1" stop-color="#5fff87"/>
    </linearGradient>
  </defs>

  <!-- abgerundeter Quadrat-Hintergrund -->
  <rect width="1024" height="1024" rx="160" fill="url(#bg)"/>
  <!-- dezente Scanlinien -->
  <g stroke="#123" stroke-width="2" opacity="0.25" clip-path="none">
    <line x1="0" y1="128" x2="1024" y2="128"/><line x1="0" y1="256" x2="1024" y2="256"/>
    <line x1="0" y1="384" x2="1024" y2="384"/><line x1="0" y1="512" x2="1024" y2="512"/>
    <line x1="0" y1="640" x2="1024" y2="640"/><line x1="0" y1="768" x2="1024" y2="768"/>
    <line x1="0" y1="896" x2="1024" y2="896"/>
  </g>

  <!-- Terminal-Dots oben (Wiedererkennung vom Banner) -->
  <circle cx="352" cy="160" r="20" fill="#ff5f56"/>
  <circle cx="416" cy="160" r="20" fill="#ffbd2e"/>
  <circle cx="480" cy="160" r="20" fill="#27c93f"/>

  <!-- LLT-Monogramm -->
  <text x="512" y="560" text-anchor="middle" font-family="DejaVu Sans Mono, monospace"
        font-weight="bold" font-size="300" fill="#00d7ff">LLT</text>

  <!-- Akzentlinie -->
  <rect x="212" y="640" width="600" height="14" fill="url(#accent)"/>

  <!-- Prompt -->
  <text x="512" y="780" text-anchor="middle" font-family="DejaVu Sans Mono, monospace"
        font-size="64" fill="#ffd75f">&gt; Auswahl:</text>
  <rect x="700" y="726" width="52" height="66" fill="#5fff87"/>
</svg>
